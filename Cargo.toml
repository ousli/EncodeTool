[package]
name = "encodetool"
version = "0.1.0"
edition = "2021"
description = "Local web app to batch rename, encode (H.265 10-bit) and apply LUTs to videos"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8"
mime_guess = "2"
chrono = "0.4"
filetime = "0.2"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
