name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Build
        run: ./build.sh

      - name: Package app
        run: |
          packaging/make-app.sh "$GITHUB_REF_NAME"
          cd dist
          shasum -a 256 EncodeTool-*.dmg > "$(ls EncodeTool-*.dmg).sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/EncodeTool-*.dmg
            dist/EncodeTool-*.dmg.sha256
